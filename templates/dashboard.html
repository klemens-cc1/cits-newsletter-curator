<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OSINT Energy Map — CITS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&family=Merriweather:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ97toznw4tLkzAhZ14PmIze9/0Tj4=" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" integrity="sha384-pmjIAcz2bAn0xukfxADbZIb3t8oRT9Sv0rvO+BR5Csr6Dhqq+nZs59P0pPKQJkEV" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" integrity="sha384-wgw+aLYNQ7dlhK47ZPK7FRACiq7ROZwgFNg0m04avm4CaXS+Z9Y7nMu8yNjBKYC+" crossorigin="anonymous" />
  <style>
    :root {
      --red:       #ba0c2f;
      --charcoal:  #252525;
      --mid:       #3a3a3a;
      --gray:      #909090;
      --muted:     #555;
      --border:    #383838;
      --panel-bg:  rgba(22, 22, 22, 0.96);
      --white:     #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Merriweather', Georgia, serif;
      background: var(--charcoal);
      color: var(--white);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    header {
      background: var(--charcoal);
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      height: 52px;
      flex-shrink: 0;
      z-index: 1000;
      border-top: 3px solid var(--red);
      box-shadow: 0 2px 12px rgba(0,0,0,0.6);
    }
    .header-title {
      font-family: 'Oswald', sans-serif;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--red);
      line-height: 1;
    }
    .header-sub {
      font-family: 'Oswald', sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .header-divider { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }
    .header-spacer  { flex: 1; }
    .nav-link {
      font-family: 'Oswald', sans-serif;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #666;
      text-decoration: none;
      padding: 4px 10px;
      border: 1px solid var(--border);
      transition: color 0.15s, border-color 0.15s;
    }
    .nav-link:hover { color: #ccc; border-color: #555; }
    .nav-link.active { color: var(--white); border-color: var(--red); background: rgba(186,12,47,0.18); }
    .wip-badge {
      font-family: 'Oswald', sans-serif;
      font-size: 9px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--red);
      border: 1px solid rgba(186,12,47,0.4);
      padding: 3px 8px;
      opacity: 0.8;
    }

    /* ── Map wrap ────────────────────────────────────────────────────── */
    #map-wrap { flex: 1; position: relative; overflow: hidden; }
    #map      { position: absolute; inset: 0; }

    /* ── Panels ──────────────────────────────────────────────────────── */
    .panel {
      position: absolute;
      z-index: 500;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-top: 2px solid var(--red);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    #sidebar {
      top: 12px; left: 12px;
      width: 236px;
      max-height: calc(100% - 24px);
      overflow-y: auto;
      padding: 14px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    #detail {
      top: 12px; right: 12px;
      width: 272px;
      max-height: calc(100% - 140px);
      overflow-y: auto;
      padding: 14px;
      display: none;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    #bottom {
      left: 260px; right: 296px; bottom: 12px;
      max-height: 136px;
      overflow-y: hidden;
      padding: 10px 14px;
    }

    /* ── Panel typography ────────────────────────────────────────────── */
    .panel-eyebrow {
      font-family: 'Oswald', sans-serif;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 8px;
    }
    .section-head {
      font-family: 'Oswald', sans-serif;
      font-size: 9px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 12px 0 5px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Oswald', sans-serif;
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 2px;
    }
    #status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }
    #status-dot.live  { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,0.6); }
    #status-dot.error { background: var(--red); }

    /* ── Layer controls ──────────────────────────────────────────────── */
    .layer-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 0;
      cursor: pointer;
      font-family: 'Oswald', sans-serif;
      font-size: 11px;
      letter-spacing: 0.5px;
      color: #888;
      user-select: none;
      transition: color 0.12s;
    }
    .layer-row:hover { color: var(--white); }
    .layer-row input[type=checkbox] {
      width: 12px; height: 12px;
      accent-color: var(--red);
      cursor: pointer;
      flex-shrink: 0;
    }
    .layer-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .layer-count { margin-left: auto; font-size: 9px; color: #444; font-family: 'Oswald', sans-serif; letter-spacing: 0.5px; }

    /* ── Grid cards ──────────────────────────────────────────────────── */
    .grid-card { border-top: 1px solid var(--border); padding: 7px 0; }
    .grid-card-hdr {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }
    .grid-iso {
      font-family: 'Oswald', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1.5px;
      color: var(--white);
    }
    .grid-ts {
      font-family: 'Oswald', sans-serif;
      font-size: 9px;
      letter-spacing: 0.5px;
      color: #444;
    }
    .fuel-row  { display: flex; align-items: center; gap: 5px; margin: 2px 0; }
    .fuel-dot  { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .fuel-name {
      font-family: 'Oswald', sans-serif;
      font-size: 10px;
      color: #888;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .fuel-track { width: 44px; height: 3px; background: rgba(255,255,255,0.06); flex-shrink: 0; }
    .fuel-fill  { height: 100%; }
    .fuel-pct   { font-family: 'Oswald', sans-serif; font-size: 9px; color: #444; width: 26px; text-align: right; }
    .grid-total { font-family: 'Oswald', sans-serif; font-size: 9px; letter-spacing: 0.5px; color: #3a3a3a; margin-top: 3px; }

    /* ── Detail panel ────────────────────────────────────────────────── */
    .detail-type {
      font-family: 'Oswald', sans-serif;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 4px;
    }
    .detail-name {
      font-family: 'Oswald', sans-serif;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: var(--white);
      line-height: 1.2;
      margin-bottom: 12px;
    }
    .detail-row   { margin: 6px 0; }
    .detail-label {
      font-family: 'Oswald', sans-serif;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1px;
    }
    .detail-value {
      font-family: 'Merriweather', serif;
      font-size: 11px;
      color: #ccc;
    }
    .flag-warn {
      font-family: 'Oswald', sans-serif;
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--red);
      border: 1px solid rgba(186,12,47,0.35);
      padding: 6px 8px;
      margin-top: 10px;
    }
    .close-btn {
      font-family: 'Oswald', sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--gray);
      cursor: pointer;
      padding: 6px 12px;
      width: 100%;
      margin-top: 12px;
      transition: border-color 0.15s, color 0.15s;
    }
    .close-btn:hover { border-color: var(--red); color: var(--white); }

    /* ── News strip ──────────────────────────────────────────────────── */
    .bottom-hdr {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .bottom-title {
      font-family: 'Oswald', sans-serif;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gray);
      white-space: nowrap;
    }
    .filter-pill {
      font-family: 'Oswald', sans-serif;
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 2px 8px;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      transition: color 0.12s, border-color 0.12s, background 0.12s;
    }
    .filter-pill:hover { color: var(--gray); border-color: #555; }
    .filter-pill.active { color: var(--white); border-color: var(--red); background: rgba(186,12,47,0.15); }
    .filter-pill.ics.active { border-color: #ef4444; background: rgba(239,68,68,0.12); color: #fca5a5; }
    .filter-pill.nrc.active { border-color: #a855f7; background: rgba(168,85,247,0.12); color: #d8b4fe; }

    #news-list {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .news-card {
      min-width: 196px;
      max-width: 236px;
      flex-shrink: 0;
      border-left: 2px solid var(--border);
      padding-left: 8px;
    }
    .news-card a {
      font-family: 'Merriweather', serif;
      font-size: 11px;
      line-height: 1.45;
      color: #bbb;
      text-decoration: none;
      display: block;
      margin-bottom: 3px;
    }
    .news-card a:hover { color: var(--white); }
    .news-meta {
      font-family: 'Oswald', sans-serif;
      font-size: 9px;
      letter-spacing: 0.5px;
      color: #444;
    }

    .empty {
      font-family: 'Oswald', sans-serif;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: #3a3a3a;
    }

    /* ── Leaflet overrides ───────────────────────────────────────────── */
    .leaflet-control-attribution {
      background: rgba(22,22,22,0.85) !important;
      color: #3a3a3a !important;
      font-size: 9px !important;
      font-family: 'Oswald', sans-serif !important;
    }
    .leaflet-control-attribution a { color: #444 !important; }
    .leaflet-control-zoom a {
      background: var(--panel-bg) !important;
      border-color: var(--border) !important;
      color: var(--gray) !important;
      font-family: 'Oswald', sans-serif !important;
    }
    .leaflet-control-zoom a:hover { background: var(--mid) !important; color: var(--white) !important; }
    .leaflet-popup-content-wrapper {
      background: var(--panel-bg) !important;
      border: 1px solid var(--border) !important;
      border-top: 2px solid var(--red) !important;
      border-radius: 0 !important;
      color: var(--white) !important;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5) !important;
    }
    .leaflet-popup-tip { background: var(--panel-bg) !important; }
    .leaflet-popup-close-button { color: var(--muted) !important; font-family: 'Oswald', sans-serif !important; }
  </style>
</head>
<body>

<header>
  <div class="header-title">CITS</div>
  <div class="header-divider"></div>
  <div class="header-sub">OSINT Map</div>
  <div class="header-divider"></div>
  <a href="/" class="nav-link">Home</a>
  <a href="/newsletter" class="nav-link">Newsletter</a>
  <a href="/research" class="nav-link">Research</a>
  <a href="/history" class="nav-link">History</a>
  <div class="header-spacer"></div>
  <span class="wip-badge">Work in Progress</span>
</header>

<div id="map-wrap">
  <div id="map"></div>

  <!-- Left: layer controls + grid status -->
  <div class="panel" id="sidebar">
    <div class="panel-eyebrow">Energy Security</div>
    <div class="status-row">
      <span id="status-dot"></span>
      <span id="status-text">Connecting…</span>
    </div>

    <div class="section-head">Infrastructure Layers</div>

    <label class="layer-row">
      <input type="checkbox" id="lyr-power_plant" checked>
      <span class="layer-dot" style="background:#f59e0b"></span>
      Power Plants
      <span class="layer-count" id="cnt-power_plant"></span>
    </label>
    <label class="layer-row">
      <input type="checkbox" id="lyr-data_center">
      <span class="layer-dot" style="background:#38bdf8"></span>
      Data Centers
      <span class="layer-count" id="cnt-data_center"></span>
    </label>
    <label class="layer-row">
      <input type="checkbox" id="lyr-substation">
      <span class="layer-dot" style="background:#eab308"></span>
      Substations
      <span class="layer-count" id="cnt-substation"></span>
    </label>
    <label class="layer-row">
      <input type="checkbox" id="lyr-pipeline">
      <span class="layer-dot" style="background:#22c55e"></span>
      Pipelines
      <span class="layer-count" id="cnt-pipeline"></span>
    </label>
    <label class="layer-row">
      <input type="checkbox" id="lyr-incidents" checked>
      <span class="layer-dot" style="background:#ba0c2f"></span>
      Incidents (90d)
      <span class="layer-count" id="cnt-incidents"></span>
    </label>

    <div class="section-head">Grid Status</div>
    <div id="grid-panel"><p class="empty">No grid data yet.</p></div>
  </div>

  <!-- Right: asset detail -->
  <div class="panel" id="detail">
    <div class="detail-type"  id="detail-type"></div>
    <div class="detail-name"  id="detail-name"></div>
    <div id="detail-body"></div>
    <button class="close-btn" onclick="closeDetail()">✕ &nbsp;Close</button>
  </div>

  <!-- Bottom: news strip -->
  <div class="panel" id="bottom">
    <div class="bottom-hdr">
      <span class="bottom-title">Recent Intelligence</span>
      <span class="filter-pill active" id="f-all"         onclick="filterNews('all')">All</span>
      <span class="filter-pill ics"   id="f-ics_advisory" onclick="filterNews('ics_advisory')">Cyber / ICS</span>
      <span class="filter-pill nrc"   id="f-nrc_event"    onclick="filterNews('nrc_event')">Nuclear</span>
    </div>
    <div id="news-list"><span class="empty">Loading…</span></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN2GGnk=" crossorigin="anonymous"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" integrity="sha384-eXVCORTRlv4FUUgS/xmOyr66XBVraen8ATNLMESp92FKXLAMiKkerixTiBvXriZr" crossorigin="anonymous"></script>
<script>
const API = '';

// Dark Carto tiles — cohesive with the dark panel aesthetic
const map = L.map('map', { zoomControl: true }).setView([38.5, -96], 4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_matter/{z}/{x}/{y}{r}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19,
}).addTo(map);

const ASSET_CFG = {
  power_plant: { color: '#f59e0b', radius: 5, label: 'Power Plant' },
  data_center: { color: '#38bdf8', radius: 6, label: 'Data Center' },
  substation:  { color: '#eab308', radius: 4, label: 'Substation'  },
  pipeline:    { color: '#22c55e', radius: 4, label: 'Pipeline'    },
};

const FUEL_COLORS = {
  'Natural Gas': '#f97316', 'Gas': '#f97316', 'NG': '#f97316',
  'Coal':        '#a8a29e',
  'Nuclear':     '#a855f7',
  'Wind':        '#22d3ee',
  'Solar':       '#facc15',
  'Hydro':       '#60a5fa', 'Hydroelectric': '#60a5fa', 'Hydro / Water': '#60a5fa',
  'Battery':     '#4ade80',
  'Oil':         '#dc2626',
  'Other':       '#94a3b8', 'Other Renewables': '#6ee7b7',
};

const layers = {};

function getOrCreateLayer(type) {
  if (!layers[type]) {
    layers[type] = type === 'incidents'
      ? L.layerGroup()
      : L.markerClusterGroup({ maxClusterRadius: 50, disableClusteringAtZoom: 11, chunkedLoading: true });
  }
  return layers[type];
}

function setStatus(text, state) {
  document.getElementById('status-text').textContent = text;
  document.getElementById('status-dot').className = state || '';
}

function setCount(type, n) {
  const el = document.getElementById(`cnt-${type}`);
  if (el) el.textContent = n > 0 ? n.toLocaleString() : '';
}

// ── Asset layers ────────────────────────────────────────────────────────────

async function loadLayer(type) {
  const cb  = document.getElementById(`lyr-${type}`);
  const cfg = ASSET_CFG[type] || { color: '#94a3b8', radius: 4, label: type };
  const lyr = getOrCreateLayer(type);
  lyr.clearLayers();

  let data;
  try {
    const r = await fetch(`${API}/api/osint/assets?type=${type}&limit=10000`);
    data = await r.json();
  } catch { return 0; }

  const features = data.features || [];
  features.forEach(f => {
    const g = f.geometry;
    if (!g || g.type !== 'Point') return;
    const [lng, lat] = g.coordinates;
    if (!lat || !lng) return;
    const marker = L.circleMarker([lat, lng], {
      radius: cfg.radius, color: cfg.color, fillColor: cfg.color,
      fillOpacity: 0.78, weight: 1, opacity: 0.9,
    });
    marker.on('click', () => showDetail(f, cfg));
    lyr.addLayer(marker);
  });

  if (cb && cb.checked) map.addLayer(lyr);
  setCount(type, features.length);
  return features.length;
}

async function loadIncidents() {
  const lyr = getOrCreateLayer('incidents');
  lyr.clearLayers();

  let rows;
  try {
    const r = await fetch(`${API}/api/osint/incidents?days=90`);
    rows = await r.json();
  } catch { return 0; }

  const geoRows = rows.filter(i => i.lat && i.lng);
  geoRows.forEach(inc => {
    const severity = inc.fatalities > 0 ? 9 : inc.injuries > 0 ? 7 : 5;
    const circle = L.circleMarker([inc.lat, inc.lng], {
      radius: severity, color: '#ba0c2f', fillColor: '#ba0c2f',
      fillOpacity: 0.35, weight: 2, opacity: 0.8,
    });

    const el = document.createElement('div');
    el.style.cssText = 'font-family:Oswald,sans-serif;min-width:160px;max-width:220px';
    const hd = document.createElement('div');
    hd.style.cssText = 'font-size:10px;letter-spacing:2px;color:#ba0c2f;text-transform:uppercase;margin-bottom:5px';
    hd.textContent = inc.type || inc.source || '';
    el.appendChild(hd);
    if (inc.date) {
      const d = document.createElement('div');
      d.style.cssText = 'font-size:11px;color:#888;margin-bottom:2px';
      d.textContent = inc.date;
      el.appendChild(d);
    }
    if (inc.operator) {
      const d = document.createElement('div');
      d.style.cssText = 'font-size:12px;color:#ddd';
      d.textContent = inc.operator;
      el.appendChild(d);
    }
    if (inc.description) {
      const d = document.createElement('div');
      d.style.cssText = 'font-family:Merriweather,serif;font-size:11px;color:#999;margin-top:5px;line-height:1.4';
      d.textContent = inc.description.slice(0, 120);
      el.appendChild(d);
    }
    circle.bindPopup(el);
    lyr.addLayer(circle);
  });

  if (document.getElementById('lyr-incidents').checked) map.addLayer(lyr);
  setCount('incidents', geoRows.length);
  return geoRows.length;
}

// ── Layer checkboxes ────────────────────────────────────────────────────────

document.querySelectorAll('input[id^="lyr-"]').forEach(cb => {
  cb.addEventListener('change', () => {
    const type = cb.id.replace('lyr-', '');
    const lyr  = layers[type];
    if (!lyr) return;
    if (cb.checked) map.addLayer(lyr); else map.removeLayer(lyr);
  });
});

// ── Detail panel ────────────────────────────────────────────────────────────

function showDetail(feature, cfg) {
  const p = feature.properties;
  document.getElementById('detail-type').textContent = (cfg && cfg.label) || p.type || 'Asset';
  document.getElementById('detail-name').textContent = p.name || '(unnamed)';

  const fields = [
    ['State',    p.state],
    ['County',   p.county],
    ['Operator', p.operator],
    ['Owner',    p.owner],
    ['Fuel',     p.fuel_type],
    ['Capacity', p.capacity_mw != null ? `${Number(p.capacity_mw).toLocaleString()} MW` : null],
    ['Voltage',  p.voltage_kv  != null ? `${p.voltage_kv} kV` : null],
    ['Status',   p.status],
    ['Source',   p.source],
  ];
  const body = document.getElementById('detail-body');
  body.replaceChildren();
  fields.filter(([, v]) => v).forEach(([label, value]) => {
    const row = document.createElement('div'); row.className = 'detail-row';
    const lbl = document.createElement('div'); lbl.className = 'detail-label'; lbl.textContent = label;
    const val = document.createElement('div'); val.className = 'detail-value'; val.textContent = value;
    row.append(lbl, val);
    body.appendChild(row);
  });
  if (p.foreign_link_flag) {
    const warn = document.createElement('div'); warn.className = 'flag-warn';
    warn.textContent = '⚠  Foreign ownership flag — review ownership chain';
    body.appendChild(warn);
  }
  document.getElementById('detail').style.display = 'block';
}

function closeDetail() { document.getElementById('detail').style.display = 'none'; }

// ── Grid panel ──────────────────────────────────────────────────────────────

function _el(tag, cls, text) {
  const el = document.createElement(tag);
  if (cls)  el.className   = cls;
  if (text !== undefined) el.textContent = text;
  return el;
}

async function loadGrid() {
  const panel = document.getElementById('grid-panel');
  let data;
  try {
    const r = await fetch(`${API}/api/osint/grid/current`);
    data = await r.json();
  } catch {
    panel.replaceChildren(_el('p', 'empty', 'Grid data unavailable.'));
    return;
  }
  const isos = Object.keys(data);
  if (!isos.length) {
    panel.replaceChildren(_el('p', 'empty', 'No grid snapshots yet.'));
    return;
  }

  panel.replaceChildren();
  isos.forEach(iso => {
    const rows  = data[iso].filter(r => r.metric === 'fuel_mix_mw' && r.fuel);
    const total = rows.reduce((s, r) => s + r.value, 0);
    const top   = [...rows].sort((a, b) => b.value - a.value).slice(0, 5);
    const ts    = rows[0]?.timestamp
      ? new Date(rows[0].timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      : '';

    const card = _el('div', 'grid-card');
    const hdr  = _el('div', 'grid-card-hdr');
    hdr.append(_el('span', 'grid-iso', iso), _el('span', 'grid-ts', ts));
    card.appendChild(hdr);

    if (!top.length) {
      card.appendChild(_el('span', 'empty', 'No data'));
    } else {
      top.forEach(r => {
        const pct = total > 0 ? (r.value / total * 100) : 0;
        const col = FUEL_COLORS[r.fuel] || '#94a3b8';
        const row = _el('div', 'fuel-row');
        const dot = _el('span', 'fuel-dot'); dot.style.background = col;
        const nm  = _el('span', 'fuel-name', r.fuel);
        const trk = _el('div', 'fuel-track');
        const fil = _el('div', 'fuel-fill'); fil.style.cssText = `width:${pct.toFixed(1)}%;background:${col}`;
        trk.appendChild(fil);
        const pc  = _el('span', 'fuel-pct', pct.toFixed(0) + '%');
        row.append(dot, nm, trk, pc);
        card.appendChild(row);
      });
      card.appendChild(_el('div', 'grid-total', (total / 1000).toFixed(1) + ' GW total'));
    }
    panel.appendChild(card);
  });
}

// ── News strip ──────────────────────────────────────────────────────────────

let allNews = [];
let activeFilter = 'all';

async function loadNews() {
  try {
    const r = await fetch(`${API}/api/osint/news?limit=60`);
    allNews = await r.json();
    if (!Array.isArray(allNews)) allNews = [];
  } catch { allNews = []; }
  renderNews();
}

function filterNews(cat) {
  activeFilter = cat;
  document.querySelectorAll('[id^="f-"]').forEach(el => el.classList.remove('active'));
  document.getElementById(cat === 'all' ? 'f-all' : `f-${cat}`)?.classList.add('active');
  renderNews();
}

function renderNews() {
  const list  = document.getElementById('news-list');
  const items = activeFilter === 'all' ? allNews : allNews.filter(a => a.category === activeFilter);
  list.replaceChildren();
  if (!items.length) {
    list.appendChild(_el('span', 'empty', 'No items')); return;
  }
  items.slice(0, 25).forEach(a => {
    let safeHref = '#';
    try {
      const p = new URL(a.url || '');
      if (p.protocol === 'https:' || p.protocol === 'http:') safeHref = p.href;
    } catch (_) {}
    const card = _el('div', 'news-card');
    const link = document.createElement('a');
    link.href = safeHref; link.target = '_blank'; link.rel = 'noopener';
    link.textContent = a.title || '(untitled)';
    const meta = _el('div', 'news-meta');
    const dt   = a.published_at ? new Date(a.published_at).toLocaleDateString([], { month: 'short', day: 'numeric' }) : '';
    meta.textContent = (a.feed_name || '') + (dt ? ' · ' + dt : '');
    card.append(link, meta);
    list.appendChild(card);
  });
}

// ── Boot ────────────────────────────────────────────────────────────────────

async function init() {
  setStatus('Connecting…', '');

  // The /api/osint/health call triggers lazy DB init on first deploy — it may
  // take up to 30 s. Retry up to 6 times at 5 s intervals before giving up.
  let dbReady = false;
  for (let i = 0; i < 6; i++) {
    try {
      const r = await fetch(`${API}/api/osint/health`);
      const j = await r.json();
      if (j.db) { dbReady = true; break; }
    } catch (_) {}
    if (i < 5) await new Promise(res => setTimeout(res, 5000));
  }

  if (!dbReady) {
    setStatus('Service unavailable', 'error');
    document.getElementById('grid-panel').replaceChildren(_el('p', 'empty', 'Could not reach API.'));
    document.getElementById('news-list').replaceChildren(_el('span', 'empty', 'API unavailable'));
    return;
  }

  setStatus('Loading…', '');

  await loadLayer('power_plant');
  await loadLayer('data_center');
  await loadIncidents();

  // Substations + pipelines are large — lazy on first toggle
  document.getElementById('lyr-substation').addEventListener('change', async function () {
    if (this.checked && (!layers.substation || layers.substation.getLayers().length === 0)) {
      setStatus('Loading substations…', '');
      await loadLayer('substation');
      setStatus('Live', 'live');
    }
  }, { once: true });

  document.getElementById('lyr-pipeline').addEventListener('change', async function () {
    if (this.checked && (!layers.pipeline || layers.pipeline.getLayers().length === 0)) {
      setStatus('Loading pipelines…', '');
      await loadLayer('pipeline');
      setStatus('Live', 'live');
    }
  }, { once: true });

  await loadGrid();
  await loadNews();
  setStatus('Live', 'live');
}

init();
</script>
